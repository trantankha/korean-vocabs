services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korean_vocab}
      POSTGRES_USER: ${POSTGRES_USER:-korean_vocab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-korean_vocab} -d ${POSTGRES_DB:-korean_vocab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: